[package]
name = "kakao-rust"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Self-hosted KakaoTalk message collection, search and text sending through an authenticated API"

readme = "README.md"
license = "MIT"
repository = "https://github.com/codemoo/kakao-rust"
include = [
    "src/**/*.rs", "src/loco/server-key.hex", "tests/**/*.rs",
    "config/device-catalog.json", "examples/synthetic.jsonl",
    "scripts/check.sh", "scripts/observe.py", "scripts/tailscale-serve.sh",
    "deploy/README.md", "deploy/*.plist", "deploy/*.service",
    "deploy/grants.example.hujson", "deploy/serve.json",
    "docs/USAGE.md", "docs/API.md", "docs/PARITY.md", "docs/TESTING.md",
    "README.md", "AGENTS.md", "PLAN.md", "Cargo.toml", "Cargo.lock", "LICENSE",
]

[dependencies]
axum = "=0.8.4"
base64 = "=0.22.1"
chrono = { version = "=0.4.41", features = ["serde"] }
clap = { version = "=4.5.40", features = ["derive"] }
hex = "=0.4.3"
rand = "=0.8.5"
qrcode = { version = "=0.14.1", default-features = false, features = ["svg"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "gzip", "stream"] }
rusqlite = { version = "=0.36.0", features = ["bundled", "hooks"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
sha2 = "=0.10.9"
subtle = "=2.6.1"
thiserror = "=2.0.12"
tokio = { version = "=1.45.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "io-util"] }
url = "=2.5.4"
uuid = { version = "=1.16.0", features = ["v4", "serde"] }
rpassword = "=7.4.0"
zeroize = "=1.9.1"
bson = "=2.15.0"
aes-gcm = "=0.10.3"
aes = { version = "=0.8.4", features = ["zeroize"] }
ctr = { version = "=0.9.2", features = ["zeroize"] }
hmac = "=0.12.1"
pbkdf2 = "=0.12.2"
md-5 = "=0.10.6"
rsa = "=0.9.8"
sha1 = "=0.10.6"
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "=1.0.12"
fs2 = "=0.4.3"
prost = "=0.13.5"
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }

[dev-dependencies]
http-body-util = "=0.1.3"
tempfile = "=3.20.0"
tower = { version = "=0.5.2", features = ["util"] }
